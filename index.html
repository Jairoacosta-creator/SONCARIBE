<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Son Caribe Stereo</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') center/cover no-repeat;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* OVERLAY OSCURO */
body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(to top,rgba(0,0,0,0.9),rgba(0,0,0,0.2));
}

/* APP */
.app{
  position:relative;
  width:360px;
  height:92vh;
  border-radius:30px;
  overflow:hidden;
  color:#fff;
}

/* HEADER */
.header{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  z-index:2;
}

.icon{
  font-size:22px;
}

/* TITULO */
.title{
  position:absolute;
  top:120px;
  width:100%;
  text-align:center;
  z-index:2;
}

.title h1{
  margin:0;
  font-size:32px;
  font-weight:bold;
}

.title span{
  font-size:14px;
  letter-spacing:2px;
}

/* EN VIVO */
.live{
  position:absolute;
  top:190px;
  width:100%;
  text-align:center;
  z-index:2;
}

.live span{
  background:red;
  padding:5px 12px;
  border-radius:20px;
  font-size:12px;
}

/* PLAYER CENTRAL */
.player{
  position:absolute;
  top:260px;
  width:100%;
  text-align:center;
  z-index:2;
}

.play-btn{
  width:120px;
  height:120px;
  border-radius:50%;
  background:radial-gradient(circle,#ff3c00,#ff0000);
  box-shadow:0 0 40px red;
  border:none;
  font-size:40px;
  color:#fff;
}

/* INFO */
.info{
  position:absolute;
  top:400px;
  width:100%;
  text-align:center;
  z-index:2;
}

.info h3{
  margin:5px;
}

.info p{
  margin:0;
  font-size:12px;
  color:#ccc;
}

/* CONTROLES */
.controls{
  position:absolute;
  bottom:100px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:40px;
  font-size:24px;
}

/* FOOTER */
.footer{
  position:absolute;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:space-around;
  font-size:14px;
}

.footer div{
  text-align:center;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<div>☰</div>
<div>🔗</div>
</div>

<div class="title">
<h1>SON CARIBE</h1>
<span>STEREO</span>
</div>

<div class="live">
<span>● EN VIVO</span>
</div>

<div class="player">
<button id="playBtn" class="play-btn">▶</button>
</div>

<div class="info">
<h3>Son Caribe Stereo</h3>
<p>La Mejor Música del Caribe</p>
</div>

<div class="controls">
<div>⏮</div>
<div>⏸</div>
<div>⏭</div>
</div>

<div class="footer">
<div>Podcast</div>
<div>Facebook</div>
<div>WhatsApp</div>
<div>TikTok</div>
</div>

<audio id="radio">
<source src="https://afradio.es/listen/soncaribestereo/radio.mp3">
</audio>

</div>

<script>
const audio=document.getElementById("radio");
const btn=document.getElementById("playBtn");

btn.onclick=()=>{
if(audio.paused){
audio.play();
btn.innerHTML="⏸";
}else{
audio.pause();
btn.innerHTML="▶";
}
};
</script>

</body>
</html>
