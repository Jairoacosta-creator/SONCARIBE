<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Son Caribe Stereo</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg,#0a0a0a,#1a1a1a);
  color:#fff;
  text-align:center;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
}

.menu-btn, .share-btn{
  font-size:24px;
  cursor:pointer;
  color:#ff5a00;
}

/* LOGO */
.logo{
  margin-top:10px;
}
.logo img{
  width:220px;
}

/* PLAYER */
.player{
  margin-top:20px;
}

.play-btn{
  width:90px;
  height:90px;
  border-radius:50%;
  background: linear-gradient(45deg,#ff3c00,#ff8c00);
  border:none;
  color:#fff;
  font-size:30px;
  cursor:pointer;
}

/* VOLUMEN */
input[type=range]{
  width:80%;
  margin:15px 0;
}

/* METADATA */
#song{
  margin-top:10px;
  font-size:16px;
  color:#ccc;
}

/* REDES */
.social{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:#111;
  padding:10px 0;
}

.social a{
  color:#ff5a00;
  font-size:22px;
  text-decoration:none;
}

/* MENU */
.menu{
  position:fixed;
  top:0;
  left:-100%;
  width:70%;
  height:100%;
  background:#000;
  padding:20px;
  transition:0.3s;
  text-align:left;
}

.menu a{
  display:block;
  padding:12px;
  color:#fff;
  text-decoration:none;
  border-bottom:1px solid #222;
}

.menu a:hover{
  background:#111;
}

</style>
</head>

<body>

<!-- MENU -->
<div id="menu" class="menu">
  <a href="#">🏠 Inicio</a>
  <a href="#">📻 En Vivo</a>
  <a href="https://afradio.es/public/soncaribestereo/schedule" target="_blank">📅 Programación</a>
  
  <!-- AQUI PONES TU URL DE NOTICIAS -->
  <a href="TU_URL_DE_NOTICIAS_AQUI" target="_blank">📰 Noticias</a>
  
  <a href="https://afradio.es/public/soncaribestereo/podcasts" target="_blank">🎧 Podcast</a>
</div>

<!-- HEADER -->
<div class="header">
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <div class="share-btn" onclick="shareApp()">🔗</div>
</div>

<!-- LOGO -->
<div class="logo">
  <img src="https://postimg.cc/jnjszb5C" alt="logo">
</div>

<!-- PLAYER -->
<div class="player">

  <button class="play-btn" onclick="togglePlay()">▶</button>

  <br>

  <input type="range" min="0" max="1" step="0.01" value="1" onchange="setVolume(this.value)">

  <div id="song">Cargando canción...</div>

</div>

<!-- AUDIO -->
<audio id="radio" src="https://afradio.es/listen/soncaribestereo/radio.mp3"></audio>

<!-- REDES -->
<div class="social">
  <a href="https://www.facebook.com/pablo.h.polo.9" target="_blank">f</a>
  <a href="whatsapp://send?text=Escucha Son Caribe Stereo&phone=573173813699">🟢</a>
  <a href="https://tiktok.com/@pauloturo" target="_blank">🎵</a>
  <a href="https://afradio.es/public/soncaribestereo/podcasts" target="_blank">🎧</a>
</div>

<script>

let audio = document.getElementById("radio");
let playing = false;

/* PLAY */
function togglePlay(){
  if(!playing){
    audio.play();
    event.target.innerHTML = "⏸";
    playing = true;
  }else{
    audio.pause();
    event.target.innerHTML = "▶";
    playing = false;
  }
}

/* VOLUMEN */
function setVolume(val){
  audio.volume = val;
}

/* MENU */
function toggleMenu(){
  let menu = document.getElementById("menu");
  if(menu.style.left === "0px"){
    menu.style.left = "-100%";
  }else{
    menu.style.left = "0";
  }
}

/* COMPARTIR */
function shareApp(){
  if(navigator.share){
    navigator.share({
      title: "Son Caribe Stereo",
      text: "Escucha la mejor música del Caribe",
      url: window.location.href
    });
  }else{
    alert("Comparte este enlace: " + window.location.href);
  }
}

/* METADATA (BÁSICO AZURACAST) */
setInterval(()=>{
  fetch("https://afradio.es/api/nowplaying/soncaribestereo")
  .then(res=>res.json())
  .then(data=>{
    let song = data.now_playing.song.title + " - " + data.now_playing.song.artist;
    document.getElementById("song").innerText = song;
  })
},5000);

</script>

</body>
</html>
