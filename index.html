<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Son Caribe Stereo</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') center/cover no-repeat;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* overlay */
body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(to top,rgba(0,0,0,0.9),rgba(0,0,0,0.2));
}

/* APP */
.app{
  position:relative;
  width:360px;
  height:92vh;
  border-radius:30px;
  overflow:hidden;
  color:#fff;
}

/* MENU */
.menu{
  position:absolute;
  left:-100%;
  top:0;
  width:70%;
  height:100%;
  background:#000;
  z-index:5;
  transition:.3s;
  padding-top:60px;
}
.menu a{
  display:block;
  padding:15px;
  color:#fff;
  text-decoration:none;
}

/* HEADER */
.header{
  position:absolute;
  top:15px;
  left:15px;
  z-index:6;
}
.menu-btn{
  font-size:22px;
  cursor:pointer;
}

/* LOGO */
.logo{
  position:absolute;
  top:40px;
  width:100%;
  text-align:center;
  z-index:4;
}
.logo img{
  width:160px;
}

/* TITULO */
.title{
  position:absolute;
  top:150px;
  width:100%;
  text-align:center;
}
.title h1{
  margin:0;
  font-size:28px;
}
.title span{
  font-size:12px;
}

/* EN VIVO */
.live{
  position:absolute;
  top:210px;
  width:100%;
  text-align:center;
}
.live span{
  background:red;
  padding:5px 12px;
  border-radius:20px;
  font-size:12px;
}

/* PLAYER */
.player{
  position:absolute;
  top:260px;
  width:100%;
  text-align:center;
}
.play-btn{
  width:110px;
  height:110px;
  border-radius:50%;
  background:radial-gradient(circle,#ff3c00,#ff0000);
  box-shadow:0 0 40px red;
  border:none;
  font-size:40px;
  color:#fff;
}

/* INFO */
.info{
  position:absolute;
  top:390px;
  width:100%;
  text-align:center;
}
.info h3{margin:5px;}
.info p{margin:0;font-size:12px;color:#ccc;}

/* CONTROLES */
.controls{
  position:absolute;
  bottom:120px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:40px;
  font-size:22px;
}

/* REDES */
.social{
  position:absolute;
  bottom:25px;
  width:100%;
  display:flex;
  justify-content:space-around;
}

.social a svg{
  width:24px;
  height:24px;
  fill:#ff8c00;
}
</style>
</head>

<body>

<div class="app">

<!-- MENU -->
<div id="menu" class="menu">
  <a href="#" onclick="closeMenu()">Inicio</a>
  <a href="https://afradio.es/public/soncaribestereo/schedule" target="_blank">Programación</a>
  <a href="https://tusitio.com/noticias" target="_blank">Noticias</a>
  <a href="https://afradio.es/public/soncaribestereo/podcasts" target="_blank">Podcast</a>
</div>

<!-- HEADER -->
<div class="header">
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<!-- LOGO -->
<div class="logo">
  <img src="https://i.postimg.cc/jnjszb5C/tu-imagen.png">
</div>

<!-- TITULO -->
<div class="title">
  <h1>SON CARIBE</h1>
  <span>STEREO</span>
</div>

<!-- EN VIVO -->
<div class="live">
  <span>● EN VIVO</span>
</div>

<!-- PLAYER -->
<div class="player">
  <button id="playBtn" class="play-btn">▶</button>
</div>

<!-- INFO -->
<div class="info">
  <h3>Son Caribe Stereo</h3>
  <p>La Mejor Música del Caribe</p>
</div>

<!-- CONTROLES -->
<div class="controls">
  <div>⏮</div>
  <div id="ctrlPlay">⏸</div>
  <div>⏭</div>
</div>

<!-- REDES -->
<div class="social">

<a href="https://afradio.es/public/soncaribestereo/podcasts">
<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7v3a7 7 0 0014 0V9a7 7 0 00-7-7z"/></svg>
</a>

<a href="https://www.facebook.com/pablo.h.polo.9">
<svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 10-11.6 9.9v-7H8v-3h2.4V9.5c0-2.4 1.4-3.7 3.5-3.7 1 0 2 .1 2 .1v2.3h-1.2c-1.2 0-1.6.7-1.6 1.5V12H17l-.5 3h-2.4v7A10 10 0 0022 12"/></svg>
</a>

<a href="whatsapp://send?phone=573173813699">
<svg viewBox="0 0 24 24"><path d="M20 3.5A11.9 11.9 0 0012 .1 12 12 0 002 20l-2 4 4-2a12 12 0 008-2.1 12 12 0 008-20.4z"/></svg>
</a>

<a href="https://tiktok.com/@pauloturo">
<svg viewBox="0 0 24 24"><path d="M9 3v12a3 3 0 11-3-3"/></svg>
</a>

</div>

<audio id="radio">
<source src="https://afradio.es/listen/soncaribestereo/radio.mp3">
</audio>

</div>

<script>
const audio=document.getElementById("radio");
const btn=document.getElementById("playBtn");

btn.onclick=()=>{
 if(audio.paused){
  audio.play();
  btn.innerHTML="⏸";
 }else{
  audio.pause();
  btn.innerHTML="▶";
 }
};

/* MENU */
function toggleMenu(){
 let m=document.getElementById("menu");
 m.style.left=(m.style.left=="0px")?"-100%":"0";
}
function closeMenu(){
 document.getElementById("menu").style.left="-100%";
}
</script>

</body>
</html>
