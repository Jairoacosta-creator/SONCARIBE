<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Son Caribe Stereo</title>

<style>

/* 🌅 FONDO CARIBEÑO */
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg,#0a0a0a,#1a0f0a,#ff5a00,#ff8c00);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* 📱 CONTENEDOR APP */
.app{
  width:100%;
  max-width:380px;
  height:90vh;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(12px);
  border-radius:25px;
  box-shadow:0 0 40px rgba(0,0,0,0.6);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  color:#fff;
}

.icon{
  font-size:22px;
  cursor:pointer;
}

/* LOGO */
.logo{
  text-align:center;
  margin-top:10px;
}

.logo img{
  width:200px;
  opacity:0.95;
}

/* PLAYER */
.player{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* BOTÓN PLAY */
.play-btn{
  width:100px;
  height:100px;
  border-radius:50%;
  border:none;
  font-size:35px;
  color:#fff;
  cursor:pointer;
  background: linear-gradient(45deg,#ff3c00,#ff8c00);
  box-shadow:0 0 25px rgba(255,100,0,0.6);
}

/* VOLUMEN */
input[type=range]{
  width:70%;
  margin-top:20px;
}

/* CANCIÓN */
#song{
  margin-top:15px;
  color:#eee;
  font-size:14px;
  text-align:center;
  padding:0 20px;
}

/* REDES */
.social{
  display:flex;
  justify-content:space-around;
  padding:12px;
  background:rgba(0,0,0,0.4);
}

.social a{
  color:#ff8c00;
  font-size:22px;
  text-decoration:none;
}

/* MENU */
.menu{
  position:absolute;
  left:-100%;
  top:0;
  width:70%;
  height:100%;
  background:#000;
  transition:.3s;
  padding-top:50px;
}

.menu a{
  display:block;
  padding:15px;
  color:#fff;
  text-decoration:none;
  border-bottom:1px solid #222;
}

</style>
</head>

<body>

<div class="app">

<!-- MENU -->
<div id="menu" class="menu">
  <a href="#">🏠 Inicio</a>
  <a href="https://afradio.es/public/soncaribestereo/schedule" target="_blank">📅 Programación</a>
  <a href="TU_URL_DE_NOTICIAS_AQUI" target="_blank">📰 Noticias</a>
  <a href="https://afradio.es/public/soncaribestereo/podcasts" target="_blank">🎧 Podcast</a>
</div>

<!-- HEADER -->
<div class="header">
  <div class="icon" onclick="toggleMenu()">☰</div>
  <div class="icon" onclick="shareApp()">🔗</div>
</div>

<!-- LOGO -->
<div class="logo">
  <img src="https://i.postimg.cc/jnjszb5C/tu-imagen.png">
</div>

<!-- PLAYER -->
<div class="player">

<button id="playBtn" class="play-btn">▶</button>

<input type="range" min="0" max="1" step="0.01" value="1" id="vol">

<div id="song">Presiona play</div>

<audio id="radio">
  <source src="https://afradio.es/listen/soncaribestereo/radio.mp3">
</audio>

</div>

<!-- REDES -->
<div class="social">
  <a href="https://www.facebook.com/pablo.h.polo.9">f</a>
  <a href="whatsapp://send?phone=573173813699">🟢</a>
  <a href="https://tiktok.com/@pauloturo">🎵</a>
  <a href="https://afradio.es/public/soncaribestereo/podcasts">🎧</a>
</div>

</div>

<script>
const audio = document.getElementById("radio");
const btn = document.getElementById("playBtn");
const vol = document.getElementById("vol");

btn.onclick = () => {
  if(audio.paused){
    audio.play();
    btn.innerHTML="⏸";
  }else{
    audio.pause();
    btn.innerHTML="▶";
  }
};

vol.oninput = () => audio.volume = vol.value;

function toggleMenu(){
  let m = document.getElementById("menu");
  m.style.left = (m.style.left=="0px")?"-100%":"0";
}

function shareApp(){
  if(navigator.share){
    navigator.share({
      title:"Son Caribe Stereo",
      url:location.href
    });
  }else{
    alert(location.href);
  }
}

/* METADATA */
setInterval(()=>{
fetch("https://afradio.es/api/nowplaying/soncaribestereo")
.then(r=>r.json())
.then(d=>{
document.getElementById("song").innerText =
d.now_playing.song.artist + " - " + d.now_playing.song.title;
});
},8000);
</script>

</body>
</html>
