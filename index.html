<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Son Caribe Stereo</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') center/cover no-repeat;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* overlay */
body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(to top,rgba(0,0,0,0.9),rgba(0,0,0,0.2));
}

/* APP */
.app{
  position:relative;
  width:360px;
  height:92vh;
  border-radius:30px;
  overflow:hidden;
  color:#fff;
}

/* LOGO */
.logo{
  position:absolute;
  top:40px;
  width:100%;
  text-align:center;
}
.logo img{width:160px;}

/* TITULO */
.title{
  position:absolute;
  top:150px;
  width:100%;
  text-align:center;
}

/* EN VIVO */
.live{
  position:absolute;
  top:210px;
  width:100%;
  text-align:center;
}
.live span{
  background:red;
  padding:5px 12px;
  border-radius:20px;
}

/* PLAYER */
.player{
  position:absolute;
  top:260px;
  width:100%;
  text-align:center;
}

.play-btn{
  width:110px;
  height:110px;
  border-radius:50%;
  background:radial-gradient(circle,#ff3c00,#ff0000);
  box-shadow:0 0 50px rgba(255,0,0,0.8);
  border:none;
  font-size:40px;
  color:#fff;
}

/* ICONOS PREMIUM */
.social{
  position:absolute;
  bottom:25px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:20px;
}

.social a{
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(10px);
  background:rgba(255,255,255,0.08);
  box-shadow:
    0 0 15px rgba(255,100,0,0.4),
    inset 0 0 10px rgba(255,255,255,0.1);
  transition:0.3s;
}

.social a:hover{
  transform:scale(1.1);
  box-shadow:0 0 25px rgba(255,120,0,0.8);
}

.social img{
  width:24px;
}

/* MENU */
.menu{
  position:absolute;
  left:-100%;
  top:0;
  width:70%;
  height:100%;
  background:#000;
  transition:.3s;
  z-index:5;
}

.menu a{
  display:block;
  padding:15px;
  color:#fff;
  text-decoration:none;
}

/* MODAL */
.modal{
  position:absolute;
  width:100%;
  height:100%;
  background:#000;
  display:none;
  z-index:6;
}

.modal iframe{
  width:100%;
  height:100%;
  border:none;
}
.close{
  position:absolute;
  top:10px;
  right:15px;
  font-size:20px;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">
<img src="https://i.postimg.cc/jnjszb5C/tu-imagen.png">
</div>

<div class="title">
<h1>SON CARIBE</h1>
<span>STEREO</span>
</div>

<div class="live"><span>● EN VIVO</span></div>

<div class="player">
<button id="playBtn" class="play-btn">▶</button>
</div>

<!-- ICONOS -->
<div class="social">

<a href="#"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384053.png"></a>

<a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png"></a>

<a href="#"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png"></a>

<a href="#"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"></a>

</div>

<!-- MENU -->
<div id="menu" class="menu">
<a onclick="openPage('https://afradio.es/public/soncaribestereo/schedule')">Programación</a>
<a onclick="openPage('https://tusitio.com/noticias')">Noticias</a>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
<div class="close" onclick="closePage()">✕</div>
<iframe id="frame"></iframe>
</div>

<audio id="radio">
<source src="https://afradio.es/listen/soncaribestereo/radio.mp3">
</audio>

</div>

<script>
const audio=document.getElementById("radio");
const btn=document.getElementById("playBtn");

btn.onclick=()=>{
if(audio.paused){
audio.play();
btn.innerHTML="⏸";
}else{
audio.pause();
btn.innerHTML="▶";
}
};

/* navegación interna */
function openPage(url){
document.getElementById("frame").src=url;
document.getElementById("modal").style.display="block";
}
function closePage(){
document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>
