<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Son Caribe Stereo</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') center/cover no-repeat;
}

/* OVERLAY OSCURO + ATARDECER */
body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(180deg,rgba(0,0,0,0.7),rgba(255,94,0,0.4));
  z-index:0;
}

/* APP */
.app{
  position:relative;
  z-index:1;
  width:100%;
  max-width:380px;
  height:90vh;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(15px);
  border-radius:25px;
  box-shadow:0 0 50px rgba(0,0,0,0.7);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  color:#fff;
}

.icon{
  font-size:22px;
  cursor:pointer;
}

/* LOGO */
.logo{
  text-align:center;
  margin-top:10px;
}
.logo img{
  width:200px;
}

/* PLAYER */
.player{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.play-btn{
  width:100px;
  height:100px;
  border-radius:50%;
  border:none;
  font-size:35px;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(45deg,#ff3c00,#ff8c00);
  box-shadow:0 0 30px rgba(255,120,0,0.8);
}

/* VOLUMEN */
input[type=range]{
  width:70%;
  margin-top:20px;
}

/* CANCIÓN */
#song{
  margin-top:15px;
  color:#eee;
  font-size:14px;
  text-align:center;
  padding:0 20px;
}

/* SOCIAL FLOAT */
.footer{
  display:flex;
  justify-content:center;
  gap:15px;
  padding:15px;
}

.social-btn{
  width:45px;
  height:45px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  text-decoration:none;
  color:#fff;
  font-size:18px;
  background:linear-gradient(45deg,#ff3c00,#ff8c00);
  box-shadow:0 0 10px rgba(255,100,0,0.6);
}

/* MENU */
.menu{
  position:absolute;
  top:0;
  left:-100%;
  width:70%;
  height:100%;
  background:#000;
  transition:.3s;
  z-index:3;
  padding-top:60px;
}

.menu a{
  display:block;
  padding:15px;
  color:#fff;
  text-decoration:none;
  border-bottom:1px solid #222;
}

/* OVERLAY CLICK */
.overlay{
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:2;
}

</style>
</head>

<body>

<div class="app">

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<!-- MENU -->
<div id="menu" class="menu">
  <a href="#">🏠 Inicio</a>
  <a href="https://afradio.es/public/soncaribestereo/schedule" target="_blank">📅 Programación</a>
  <a href="https://tusitio.com/noticias" target="_blank">📰 Noticias</a>
  <a href="https://afradio.es/public/soncaribestereo/podcasts" target="_blank">🎧 Podcast</a>
</div>

<!-- HEADER -->
<div class="header">
  <div class="icon" onclick="openMenu()">☰</div>
  <div class="icon" onclick="shareApp()">🔗</div>
</div>

<!-- LOGO -->
<div class="logo">
  <img src="https://i.postimg.cc/jnjszb5C/tu-imagen.png">
</div>

<!-- PLAYER -->
<div class="player">

<button id="playBtn" class="play-btn">▶</button>

<input type="range" min="0" max="1" step="0.01" value="1" id="vol">

<div id="song">Presiona play</div>

<audio id="radio">
  <source src="https://afradio.es/listen/soncaribestereo/radio.mp3">
</audio>

</div>

<!-- REDES -->
<div class="footer">
  <a class="social-btn" href="https://www.facebook.com/pablo.h.polo.9">f</a>
  <a class="social-btn" href="whatsapp://send?phone=573173813699">W</a>
  <a class="social-btn" href="https://tiktok.com/@pauloturo">T</a>
  <a class="social-btn" href="https://afradio.es/public/soncaribestereo/podcasts">P</a>
</div>

</div>

<script>
const audio = document.getElementById("radio");
const btn = document.getElementById("playBtn");
const vol = document.getElementById("vol");

btn.onclick = () => {
  if(audio.paused){
    audio.play();
    btn.innerHTML="⏸";
  }else{
    audio.pause();
    btn.innerHTML="▶";
  }
};

vol.oninput = () => audio.volume = vol.value;

/* MENU CONTROL */
function openMenu(){
  document.getElementById("menu").style.left="0";
  document.getElementById("overlay").style.display="block";
}

function closeMenu(){
  document.getElementById("menu").style.left="-100%";
  document.getElementById("overlay").style.display="none";
}

function shareApp(){
  if(navigator.share){
    navigator.share({title:"Son Caribe Stereo",url:location.href});
  }else{
    alert(location.href);
  }
}

/* METADATA */
setInterval(()=>{
fetch("https://afradio.es/api/nowplaying/soncaribestereo")
.then(r=>r.json())
.then(d=>{
document.getElementById("song").innerText =
d.now_playing.song.artist + " - " + d.now_playing.song.title;
});
},8000);
</script>

</body>
</html>
