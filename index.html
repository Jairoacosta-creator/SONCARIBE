<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Son Caribe Stereo</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg,#000000cc,#000000aa),
              url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') center/cover no-repeat;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* APP */
.app{
  width:100%;
  max-width:360px;
  height:92vh;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  border-radius:25px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  color:#fff;
}

.icon{font-size:22px;cursor:pointer}

/* LOGO */
.logo{text-align:center;margin-top:10px;}
.logo img{width:180px;}

/* PLAYER */
.player{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.play-btn{
  width:90px;
  height:90px;
  border-radius:50%;
  background:linear-gradient(45deg,#ff3c00,#ff8c00);
  border:none;
  color:#fff;
  font-size:30px;
}

/* TEXTO */
#song{margin-top:15px;color:#eee;font-size:14px;text-align:center}

/* REDES */
.footer{
  display:flex;
  justify-content:space-around;
  padding:15px;
}

.footer a{
  color:#ff8c00;
  font-size:22px;
  text-decoration:none;
}

/* MENU */
.menu{
  position:absolute;
  left:-100%;
  top:0;
  width:70%;
  height:100%;
  background:#000;
  transition:.3s;
  padding-top:50px;
}

.menu a{
  display:block;
  padding:15px;
  color:#fff;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="app">

<div id="menu" class="menu">
<a href="#" onclick="closeMenu()">Inicio</a>
<a href="https://afradio.es/public/soncaribestereo/schedule">Programación</a>
<a href="#">Noticias</a>
<a href="https://afradio.es/public/soncaribestereo/podcasts">Podcast</a>
</div>

<div class="header">
<div class="icon" onclick="toggleMenu()">☰</div>
<div class="icon">🔗</div>
</div>

<div class="logo">
<img src="https://i.postimg.cc/jnjszb5C/tu-imagen.png">
</div>

<div class="player">
<button id="playBtn" class="play-btn">▶</button>
<div id="song">Presiona play</div>

<audio id="radio">
<source src="https://afradio.es/listen/soncaribestereo/radio.mp3">
</audio>
</div>

<div class="footer">
<a href="https://www.facebook.com/pablo.h.polo.9">F</a>
<a href="whatsapp://send?phone=573173813699">W</a>
<a href="https://tiktok.com/@pauloturo">T</a>
<a href="https://afradio.es/public/soncaribestereo/podcasts">P</a>
</div>

</div>

<script>
const audio=document.getElementById("radio");
const btn=document.getElementById("playBtn");

btn.onclick=()=>{
if(audio.paused){audio.play();btn.innerHTML="⏸";}
else{audio.pause();btn.innerHTML="▶";}
};

function toggleMenu(){
let m=document.getElementById("menu");
m.style.left=(m.style.left=="0px")?"-100%":"0";
}
function closeMenu(){
document.getElementById("menu").style.left="-100%";
}
</script>

</body>
</html>
